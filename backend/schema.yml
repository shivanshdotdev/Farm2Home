      - FARMER
      - CONSUMER
      - ADMIN
      type: string
      description: |-
        * `FARMER` - Farmer
        * `CONSUMER` - Consumer
        * `ADMIN` - Admin
    Status28eEnum:
      enum:
      - PENDING
      - ESCROW_FUNDED
      - DISPATCHED
      - IN_TRANSIT
      - DELIVERED
      - COMPLETED
      - DISPUTED
      - CANCELLED
      - REFUNDED
      type: string
      description: |-
        * `PENDING` - Pending Payment
        * `ESCROW_FUNDED` - Escrow Funded (Funds Locked)
        * `DISPATCHED` - Dispatched by Farmer
        * `IN_TRANSIT` - In Transit (Logistics Courier)
        * `DELIVERED` - Delivered to Customer
        * `COMPLETED` - Completed (Funds Released to Farmer)
        * `DISPUTED` - Disputed (Funds Frozen in Escrow)
        * `CANCELLED` - Cancelled
        * `REFUNDED` - Refunded
