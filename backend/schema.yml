        * `FINANCIAL_SUPPORT` - Direct Financial Support (PM-KISAN)
        * `DIGITIZATION` - Digital Registries & Identity (AgriStack)
        * `INSURANCE` - Crop Insurance & Risk Mitigation (PMFBY)
        * `CREDIT` - Institutional Credit (KCC / JanSamarth)
        * `SUBSIDY` - Inputs, Soil & Irrigation Subsidies
    LogisticsPartnerEnum:
