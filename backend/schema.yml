        msp_per_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Government MSP in INR per kg (msp_per_quintal / 100)
        marketing_season:
          type: string
          maxLength: 50
        is_active:
          type: boolean
      required:
      - crop_name
      - id
      - msp_per_kg
      - msp_per_quintal
